{% extends "base.html" %}

{% block title %}Novo pet - SavePet{% endblock %}

{% block content %}
<div class="mb-4">
    <h1 class="h4 mb-1">Novo pet</h1>
    <p class="text-muted mb-0">Cadastro simples de pet.</p>
</div>

<form method="post" enctype="multipart/form-data" novalidate>
    {% csrf_token %}
    <div class="card shadow-sm">
        <div class="card-body">
            <div class="row g-3">
                {% for field in form %}
                    <div class="col-md-6">
                        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {{ field }}
                        {% for error in field.errors %}
                            <div class="text-danger small">{{ error }}</div>
                        {% endfor %}
                    </div>
                {% endfor %}
            </div>
        </div>
    </div>

    <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a href="{% url 'pets:index' %}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
