{% extends "base.html" %}

{% block title %}{{ title }} - SavePet{% endblock %}

{% block content %}
<div class="page-header">
    <div><h1 class="page-title">{{ title }}</h1><p class="page-subtitle">Publique conteúdo de saúde, nutrição e bem-estar.</p></div>
    <a href="{% url 'admin_panel' %}" class="pet-btn-secondary">Cancelar</a>
</div>
<form method="post" novalidate>
    {% csrf_token %}
    <div class="pet-card">
        <div class="row g-3">
            {% for field in form %}
                <div class="{% if field.name == 'conteudo' or field.name == 'resumo' or field.name == 'imagem_url' or field.name == 'titulo' %}col-12{% else %}col-md-4{% endif %}">
                    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {{ field.errors }}
                </div>
            {% endfor %}
        </div>
    </div>
    <button type="submit" class="pet-btn-primary mt-4">Salvar artigo</button>
</form>
{% endblock %}
