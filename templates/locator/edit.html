{% extends "base.html" %}

{% block title %}Editar rastreador - SavePet{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Editar rastreador</h1>
        <p class="page-subtitle">Atualize o dispositivo vinculado ao pet.</p>
    </div>
    <a href="{% url 'locator:index' %}" class="pet-btn-secondary">Cancelar</a>
</div>

<form method="post" novalidate>
    {% csrf_token %}
    <div class="pet-card">
        <div class="row g-3">
            {% for field in form %}
                <div class="col-md-6">
                    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {{ field.errors }}
                </div>
            {% endfor %}
        </div>
    </div>
    <button type="submit" class="pet-btn-primary mt-4">Salvar alterações</button>
</form>
{% endblock %}
